[project]
name = "softscope"
version = "v0.0.1"
authors = [
    { name="ityeri", email="ityeri9@gmail.com" },
]
description = "오실로스코프의 동작을 모방한 2D 서라운드 오디오 비주얼라이저"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=2.2.6",
    "pyaudio>=0.2.14",
    "pygame>=2.6.1",
    "soundcard>=0.4.5",
    "soundfile>=0.13.1",
]

[project.urls]
Homepage = "https://github.com/ityeri/softscope"
Issues = "https://github.com/ityeri/softscope/issues"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.uv]
managed = true
